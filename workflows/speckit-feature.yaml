name: speckit-feature
version: 0.1.0

phases:
  - id: specify
    owner: claude
    description: Produce the initial feature specification from an operator brief.
    next: clarify

  - id: clarify
    owner: claude
    description: Ask product and behavior questions, then wait for operator decisions.
    gate: before_plan
    next: plan

  - id: plan
    owner: claude
    description: Produce the implementation plan and architecture notes.
    next: tasks

  - id: tasks
    owner: claude
    description: Produce concrete implementation tasks for Codex.
    gate: before_implementation
    next: implement

  - id: implement
    owner: codex
    description: Implement the task list and run local verification.
    next: review

  - id: review
    owner: claude
    description: Review implementation against the spec and task list.
    next: manual_acceptance

  - id: manual_acceptance
    owner: operator
    description: Record manual QA result and decide whether the feature can proceed.
    gate: before_merge
    next: done

  - id: done
    owner: operator
    description: Feature cycle is complete.
