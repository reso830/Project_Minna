roles:
  operator:
    may:
      - approve_phase_transition
      - answer_clarification
      - accept_manual_test
      - reject_manual_test
  claude:
    may:
      - draft_spec
      - ask_clarification
      - draft_plan
      - draft_tasks
      - review_implementation
  codex:
    may:
      - inspect_repository
      - implement_tasks
      - run_tests
      - propose_fix

gates:
  before_plan:
    requires:
      - operator_clarification_complete
  before_implementation:
    requires:
      - operator_plan_approved
      - tasks_available
  before_merge:
    requires:
      - automated_tests_passed
      - claude_review_complete
      - operator_manual_acceptance
